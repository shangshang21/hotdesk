<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>热点工坊 · Hotdesk Studio</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header>
  <div class="brand">
    <span class="logo">H</span>
    <div><strong>热点工坊</strong><small>HOTDESK / CREATIVE STUDIO</small></div>
    <div class="mode-switcher" id="mode-switcher">
      <button class="mode-btn active" id="btn-mode-article">📝 纸质/图文文章创作</button>
      <button class="mode-btn" id="btn-mode-video">🎬 短视频二创工坊</button>
    </div>
  </div>
  <div class="header-actions">
    <span id="connection">连接中…</span>
    <button id="agent-help" class="quiet">Agent 接入</button>
    <button id="settings" class="quiet">数据源设置</button>
  </div>
</header>
<main>
  <!-- 1. 图文创作侧边栏 -->
  <aside id="aside-article">
    <div class="section-title"><h2>热点雷达</h2><span id="topic-count" class="pill">0</span></div>
    <p class="muted">先把流程跑通，再找到你的方向。</p>
    <div class="row"><select id="discovery-source" aria-label="热榜来源"><option value="baidu">百度 · 实时热搜（直连）</option><option value="bilibili">B站 · 热门</option><option value="tieba">贴吧 · 热议</option><option value="reddit">Reddit · 热门</option><option value="trendradar">TrendRadar · 本地库</option><option value="newsnow:weibo">NewsNow · 微博热搜</option><option value="newsnow:zhihu">NewsNow · 知乎热榜</option><option value="newsnow:douyin">NewsNow · 抖音热点</option><option value="newsnow:toutiao">NewsNow · 今日头条</option><option value="newsnow:baidu">NewsNow · 百度热搜</option><option value="newsnow:bilibili-hot-search">NewsNow · B站热搜</option><option value="newsnow:tieba">NewsNow · 贴吧热议</option><option value="newsnow:hupu">NewsNow · 虎扑</option><option value="newsnow:kuaishou">NewsNow · 快手</option><option value="newsnow:douban">NewsNow · 豆瓣</option><option value="newsnow:thepaper">NewsNow · 澎湃</option></select><button id="discover">发现热点</button></div>
    <div class="row"><input id="new-title" placeholder="也可以直接输入一个选题" aria-label="新选题"><button id="create" class="quiet">＋</button></div>
    <input id="filter" class="full" placeholder="筛选当前热点…" aria-label="筛选热点">
    <div id="topics" class="topics"></div>
  </aside>

  <!-- 2. 短视频创作侧边栏 -->
  <aside id="aside-video" style="display:none;">
    <div class="section-title"><h2>视频二创工坊</h2><span id="video-count" class="pill">0</span></div>
    <p class="muted">消灭老外原声 · 纯伴奏提纯 · 剪映直出</p>
    <div class="row"><input id="new-video-title" placeholder="二创项目名称" aria-label="视频选题"></div>
    <div class="row"><input id="new-video-url" placeholder="海外/B站链接 或 本地MP4路径" aria-label="视频源"><button id="create-video">＋ 创建</button></div>
    <input id="filter-video" class="full" placeholder="筛选视频项目…" aria-label="筛选视频">
    <div id="video-projects" class="topics"></div>
  </aside>

  <!-- 3. 中央主工作区 -->
  <section id="workspace"></section>
</main>
<footer><div class="section-title"><h2>运行记录</h2><span class="muted">每 4 秒同步 · 失败不会被当作完成</span></div><div id="jobs"></div></footer>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><div class="section-title"><h2 id="modal-title"></h2><button id="close-modal" class="quiet">关闭</button></div><div id="modal-body"></div></dialog>
</body></html>
